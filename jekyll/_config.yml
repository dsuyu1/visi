title: "Vaquero Information Security Initiative"
description: "A UTRGV student organization and nonprofit helping students launch careers in information security."
lang: en
timezone: America/Chicago
include:
  - _redirects
  - _headers
exclude:
  - build.sh
  - Gemfile
  - Gemfile.lock
# Sign in. The hub starts the Keycloak flow, so the Keycloak page is the
# only sign-in page; /login/ redirects here too (see _redirects).
hub_url: "https://hub.visiutrgv.org"
login_url: "https://hub.visiutrgv.org/auth/login"

defaults:
  - scope:
      path: ""
    values:
      layout: default

# /support/ page settings. See workers/support-intake/README.md.
support:
  intake_url: "https://intake.visiutrgv.org/submit"
  # Turnstile site key for visiutrgv.org. Public by design; the secret key
  # lives only in the Worker (wrangler secret TURNSTILE_SECRET).
  turnstile_sitekey: "0x4AAAAAAGEpYMliJySXf9Ih"
  portal_url: "https://visiutrgv.atlassian.net/servicedesk/customer/portals"
  response_goal: "3 business days"
  fallback_email: "contact@visiutrgv.org"
