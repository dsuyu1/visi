title: "Vaquero Information Security Initiative"
description: "A UTRGV student organization and nonprofit helping students launch careers in information security."
lang: en
timezone: America/Chicago
include:
  - _redirects
  - _headers
exclude:
  - build.sh
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: ""
    values:
      layout: default

# /support/ page settings. See workers/support-intake/README.md.
support:
  intake_url: "https://intake.visiutrgv.org/submit"
  # Cloudflare's always-pass TEST key. Replace with the real site key from
  # Turnstile before launch. The Worker rejects test tokens in production.
  turnstile_sitekey: "1x00000000000000000000AA"
  portal_url: "https://visiutrgv.atlassian.net/servicedesk/customer/portals"
  response_goal: "3 business days"
  fallback_email: "damian.villarreal01@utrgv.edu"
