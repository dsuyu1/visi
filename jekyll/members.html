---
title: Members
permalink: /about/members/
banner: /home/group-photo.jpg
---
<div class="grid">
  {% for member in site.data.members %}
  <article class="card">
    {% if member.avatarUrl %}<img src="{{ member.avatarUrl | escape }}" alt="" width="96" loading="lazy">{% endif %}
    <h2>{{ member.name | escape }}</h2>
    <p>{{ member.role | escape }}{% if member.focus %} · {{ member.focus | escape }}{% endif %}</p>
  </article>
  {% endfor %}
</div>
